rules_version: 1

# AEGIS-004 — structural dependency rules, enforced by tools/check_architecture.py.
#
# The exchange and the trading participant are separate systems connected only by
# versioned messages (docs/ARCHITECTURE.md). That separation is worth nothing if
# it lives only in prose, so it is expressed here as edges a checker can reject.
#
# Conventions this file assumes (see adr/0001-platform-architecture.md):
#   * C++ quoted includes are written relative to the repository root, e.g.
#     #include "cpp/common/clock.hpp". Angle includes are system/third-party.
#   * Python modules are imported with `python/` on sys.path, e.g. `common.config`.
#   * `may_depend_on` is exhaustive: an edge that is not listed is denied.
#   * `expect_sources_from_milestone` makes emptiness a checked fact. Before that
#     milestone the layer must contain no sources; from it, the layer must not be
#     empty, so the rule cannot keep passing vacuously once the work lands.

include_convention: repository-root-relative

layers:
  # ---------------------------------------------------------------- substrate
  - name: cpp-common
    paths: [cpp/common]
    language: cpp
    namespaces: [aegis::common]
    may_depend_on: []
    expect_sources_from_milestone: M0

  - name: cpp-events
    paths: [cpp/events]
    language: cpp
    namespaces: [aegis::events]
    may_depend_on: [cpp-common]
    expect_sources_from_milestone: M0

  - name: cpp-bindings
    paths: [cpp/bindings]
    language: cpp
    namespaces: [aegis::bindings]
    # cpp-replay added M2 slice 13 (AEGIS-229): the binding surface exposes
    # the canonical replay order (ReplayEvent, canonical_less) to Python.
    # cpp-statistics added M3 slice 1 (AEGIS-107): the cross-language
    # validation report needs the C++ estimators callable from Python. No
    # other cpp-exchange-* or cpp-participant-* layer is added here -- the
    # binding does not widen past what each milestone actually needs bound.
    may_depend_on: [cpp-common, cpp-events, cpp-replay, cpp-statistics]
    expect_sources_from_milestone: M0
    allows_python_headers: true

  # ------------------------------------------------------------- exchange side
  - name: cpp-exchange-sequencer
    paths: [cpp/exchange/sequencer]
    language: cpp
    namespaces: [aegis::exchange]
    may_depend_on: [cpp-common, cpp-events]
    expect_sources_from_milestone: M1

  - name: cpp-exchange-order-book
    paths: [cpp/exchange/order_book]
    language: cpp
    namespaces: [aegis::exchange]
    may_depend_on: [cpp-common, cpp-events]
    expect_sources_from_milestone: M1

  - name: cpp-exchange-matching
    paths: [cpp/exchange/matching]
    language: cpp
    namespaces: [aegis::exchange]
    may_depend_on: [cpp-common, cpp-events, cpp-exchange-order-book]
    expect_sources_from_milestone: M1

  # Event log, journal and snapshot codec are exchange *state*: neither matching
  # nor market data, so placing them under either layer would let that layer's
  # emptiness check pass vacuously (ADR-0012).
  - name: cpp-exchange-state
    paths: [cpp/exchange/state]
    language: cpp
    namespaces: [aegis::exchange]
    may_depend_on: [cpp-common, cpp-events, cpp-exchange-sequencer, cpp-exchange-order-book]
    expect_sources_from_milestone: M1

  # The composition root: nothing else may legally see all of sequencer, book,
  # matching and state at once (ADR-0012). cpp-exchange-market-data added M3
  # slice 1: the composition root is where the market-data publisher is wired
  # to the book it observes (ADR-0020).
  - name: cpp-exchange-app
    paths: [cpp/exchange/app]
    language: cpp
    namespaces: [aegis::exchange]
    may_depend_on: [cpp-common, cpp-events, cpp-exchange-sequencer, cpp-exchange-order-book,
                    cpp-exchange-matching, cpp-exchange-state, cpp-exchange-market-data]
    expect_sources_from_milestone: M1

  # No M1 requirement asks the exchange to publish a market-data feed; the first
  # genuine consumer is the participant feed handler and book reconstruction
  # (AEGIS-064-070, M3). Re-dated from M1 to M3 in ADR-0012 — see that ADR and
  # docs/DEFERRED_VERIFICATION.md for the reasoning. No requirement is attached
  # to this layer, so re-dating it defers nothing.
  - name: cpp-exchange-market-data
    paths: [cpp/exchange/market_data]
    language: cpp
    namespaces: [aegis::exchange]
    may_depend_on: [cpp-common, cpp-events, cpp-exchange-order-book]
    expect_sources_from_milestone: M3

  - name: cpp-replay
    paths: [cpp/replay]
    language: cpp
    namespaces: [aegis::replay]
    may_depend_on: [cpp-common, cpp-events]
    expect_sources_from_milestone: M2

  # ---------------------------------------------------------- participant side
  # The pipeline is forward-only: feed -> book -> statistics -> strategy -> risk
  # -> oms -> portfolio. Strategy cannot reach the OMS, a gateway, or anything on
  # the exchange side; the OMS is the only module permitted to touch a gateway or
  # broker adapter (AEGIS-119, AEGIS-120).
  - name: cpp-participant-feed-handler
    paths: [cpp/participant/feed_handler]
    language: cpp
    namespaces: [aegis::participant::feed]
    may_depend_on: [cpp-common, cpp-events]
    expect_sources_from_milestone: M3

  - name: cpp-participant-book-builder
    paths: [cpp/participant/book_builder]
    language: cpp
    namespaces: [aegis::participant::book]
    may_depend_on: [cpp-common, cpp-events, cpp-participant-feed-handler]
    expect_sources_from_milestone: M3

  # Generic numeric library, not a participant component: it knows nothing of
  # books, orders, feeds or participants, so M4-M7 can reuse it without
  # inheriting participant-domain types (ADR-0020, ADR-0022). Narrowed from
  # [cpp-common, cpp-participant-book-builder] at M3 slice 1 -- the book
  # builder and this layer meet only at cpp-participant-app.
  - name: cpp-statistics
    paths: [cpp/statistics]
    language: cpp
    namespaces: [aegis::participant::stats]
    may_depend_on: [cpp-common]
    expect_sources_from_milestone: M3

  - name: cpp-participant-strategy
    paths: [cpp/participant/strategy]
    language: cpp
    namespaces: [aegis::participant::strategy]
    may_depend_on: [cpp-common, cpp-events, cpp-participant-book-builder, cpp-statistics]
    expect_sources_from_milestone: M4

  - name: cpp-participant-risk
    paths: [cpp/participant/risk]
    language: cpp
    namespaces: [aegis::participant::risk]
    may_depend_on: [cpp-common, cpp-events, cpp-participant-strategy, cpp-statistics]
    expect_sources_from_milestone: M5

  - name: cpp-participant-oms
    paths: [cpp/participant/oms]
    language: cpp
    namespaces: [aegis::participant::oms]
    may_depend_on: [cpp-common, cpp-events, cpp-participant-risk]
    expect_sources_from_milestone: M3
    allows_gateway_adapters: true

  - name: cpp-participant-portfolio
    paths: [cpp/participant/portfolio]
    language: cpp
    namespaces: [aegis::participant::portfolio]
    may_depend_on: [cpp-common, cpp-events]
    expect_sources_from_milestone: M3

  # The participant composition root (ADR-0020), mirroring cpp-exchange-app:
  # nothing else may legally see feed handler, book builder, statistics, OMS
  # and portfolio at once. It is the only participant layer permitted to
  # depend on cpp-replay -- that is how M2's DeterministicFaultInjector
  # reaches the participant for AEGIS-060/061 without either layer depending
  # on the other. It has no edge to any cpp-exchange-* layer: the exchange and
  # the participant meet only through versioned messages, at a process/stream
  # boundary or a test-only integration harness, never a production
  # dependency (MASTER_SPEC immutable principle 1).
  - name: cpp-participant-app
    paths: [cpp/participant/app]
    language: cpp
    namespaces: [aegis::participant::app]
    may_depend_on: [cpp-common, cpp-events, cpp-replay, cpp-participant-feed-handler,
                    cpp-participant-book-builder, cpp-statistics, cpp-participant-oms,
                    cpp-participant-portfolio]
    expect_sources_from_milestone: M3

  # ------------------------------------------------- performance work (M8 only)
  - name: cpp-memory
    paths: [cpp/memory]
    language: cpp
    namespaces: [aegis::memory]
    may_depend_on: [cpp-common]
    expect_sources_from_milestone: M8

  - name: cpp-queues
    paths: [cpp/queues]
    language: cpp
    namespaces: [aegis::queues]
    may_depend_on: [cpp-common]
    expect_sources_from_milestone: M8

  # ----------------------------------------------------------- Python research
  - name: python-common
    paths: [python/common]
    language: python
    may_depend_on: []
    expect_sources_from_milestone: M0

  - name: python-data
    paths: [python/data]
    language: python
    may_depend_on: [python-common]
    expect_sources_from_milestone: M0

  - name: python-futures
    paths: [python/futures]
    language: python
    may_depend_on: [python-common, python-data]
    expect_sources_from_milestone: M2

  - name: python-research
    paths: [python/research]
    language: python
    may_depend_on: [python-common, python-data, python-futures]
    expect_sources_from_milestone: M4

  - name: python-validation
    paths: [python/validation]
    language: python
    may_depend_on: [python-common, python-data, python-futures, python-research]
    expect_sources_from_milestone: M5

  - name: python-attribution
    paths: [python/attribution]
    language: python
    may_depend_on: [python-common, python-data, python-futures, python-research]
    expect_sources_from_milestone: M6

  - name: python-reports
    paths: [python/reports]
    language: python
    may_depend_on: [python-common, python-data, python-futures, python-research, python-attribution, python-validation]
    expect_sources_from_milestone: M4

  # ------------------------------------------------------------ product surface
  # These consume versioned APIs, never engine internals (AEGIS-217).
  - name: decision-arena
    paths: [decision_arena]
    language: python
    may_depend_on: [python-common]
    expect_sources_from_milestone: M7

  - name: dashboard
    paths: [dashboard]
    language: python
    may_depend_on: [python-common]
    expect_sources_from_milestone: M9

# Roots under total-coverage enforcement: every source file below them must map
# to exactly one layer, so a package added in a later milestone fails the check
# instead of being silently unconstrained.
covered_roots: [cpp, python, decision_arena, dashboard]

banned:
  # A relative include climbing out of its own directory routes around the DAG.
  parent_relative_includes: true
  # pybind11 and Python.h belong to exactly one layer (AEGIS-229).
  python_headers_only_in: [cpp-bindings]
  # Gateway/broker adapter headers belong to the OMS (AEGIS-119, AEGIS-120).
  gateway_header_markers: [gateway, broker_adapter, exchange_adapter]
  # Hidden global state defeats deterministic replay and the single-writer rule.
  mutable_globals_forbidden_in: [cpp-exchange-sequencer, cpp-exchange-order-book,
                                 cpp-exchange-matching, cpp-exchange-market-data,
                                 cpp-exchange-state, cpp-exchange-app,
                                 cpp-participant-feed-handler, cpp-participant-book-builder,
                                 cpp-participant-strategy, cpp-participant-risk,
                                 cpp-participant-oms, cpp-participant-portfolio,
                                 cpp-participant-app, cpp-statistics]
