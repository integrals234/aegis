policy_version: 1

# AEGIS governance policy — the authoritative source (R8, ADR-0014).
#
# THIS FILE IS ONLY AUTHORITATIVE ON PROTECTED `main`.
#
# tools/governance/authoritative_check.py always reads this file from the base
# branch of the pull request it is judging, never from the pull request's own
# head. A branch may therefore edit its own copy freely and gain nothing: the
# edit takes effect only once the owner has merged it into `main`, and merging
# requires an approving review from the owner identity, which the agent's
# GitHub App credential cannot produce for its own pull requests.
#
# That is the whole trust boundary. Everything else — docs/BUILD_STATE.md,
# tools/check_scope.py, tools/check_frozen.py — is advisory local feedback.
#
# Why this exists: before R8, owner scope approvals were parsed from a line in
# docs/BUILD_STATE.md, a file the agent is explicitly allowed to write. An
# agent could authorise its own out-of-scope change, and — because
# tools/check_frozen.py read the same line — could also authorise editing a
# frozen specification file together with its own recorded digest. Four
# self-authorisation routes in total; see adr/0014-governance-trust-boundary.md.

# The one active milestone (AEGIS-007). tools/check_architecture.py and
# tools/audit_requirements.py read docs/BUILD_STATE.md, which mirrors this
# value; the authoritative gate requires the two to agree, so a branch cannot
# grant itself a wider scope by editing the mirror.
active_milestone: M4

# Paths that decide who is allowed to change what. A pull request touching any
# of these needs an explicit approval below, because changing them changes the
# rules rather than the code. Globs are permitted here; approvals are not
# permitted to use them.
governance_paths:
  - configs/governance/**
  - configs/milestone_scope.yaml
  - requirements/frozen_hashes.json
  - .github/workflows/governance.yml
  - .github/workflows/ci.yml
  - tools/governance/**
  - tools/check_scope.py
  - tools/check_frozen.py
  # Added at the M3 transition. tools/update_status.py is the sole sanctioned
  # writer of requirements/implementation_status.json and now controls
  # obligation clearing, deferral registration and the append-only deferral
  # ledger; tools/audit_requirements.py is the control of record it writes
  # against. Protecting the writer without the judge would protect the weaker
  # of the two, so both are listed. Neither carries an M3 approval: M3 should
  # need to touch neither, and a defect found in either is worth one small
  # owner-reviewed pull request rather than a silent in-branch fix.
  - tools/update_status.py
  - tools/audit_requirements.py
  # configs/architecture_rules.yaml is the machine-readable half of
  # docs/ARCHITECTURE.md — the enforced dependency law. Leaving it
  # branch-editable let a candidate widen its own may_depend_on edges, re-date
  # a layer or relax a banned construct: the same self-authorisation class this
  # policy closed for tools/check_scope.py and tools/check_frozen.py
  # (adr/0014-governance-trust-boundary.md). M3's genuine transition is carried
  # by the exact-path m3-architecture-transition approval below, which
  # enumerates every authorised change and expires with the milestone.
  - configs/architecture_rules.yaml
  - .claude/settings.json
  - .claude/hooks/protect_spec.py

# This file is deliberately exempt from the rule above. It is inert until
# merged, and merging is the owner's act, so allowing a branch to *propose* a
# policy change costs nothing and keeps the approval ceremony to one small
# reviewable pull request.
self_path: configs/governance/policy.yaml

# Owner-granted exceptions. Exact repository-relative paths only — never globs,
# so an approval can never widen beyond what was reviewed. An approval whose
# `milestone` is not the active milestone is inert, so permissions expire when
# the milestone does.
#
# Granting one means merging a pull request that adds an entry here. There is
# no other channel.
#
# entry:
#   - id: short-kebab-identifier
#     milestone: M2
#     paths: [exact/path/one, exact/path/two]
#     reason: >
#       why the milestone's declared scope genuinely cannot cover this
#     granted_on: YYYY-MM-DD
#     granted_by_pr: <number>
approvals:
  - id: m2-build-and-gate
    milestone: M2
    paths:
      - cpp/CMakeLists.txt
      - scripts/ci_local.sh
      - .github/workflows/ci.yml
    reason: >
      cpp/replay cannot build without a subdirectory entry, and the milestone
      gate is hardcoded to M1 in both the local script and the workflow.
    granted_on: 2026-08-10
    granted_by_pr: 5

  - id: m2-columnar-dependencies
    milestone: M2
    paths:
      - requirements/python-requirements.in
      - requirements/requirements.lock
      - pyproject.toml
    reason: >
      AEGIS-230 requires pyarrow/duckdb; AEGIS-013 requires pinned tzdata.
    granted_on: 2026-08-10
    granted_by_pr: 5

  # The two M2 approvals above are inert from here on: approved_paths() skips
  # any entry whose milestone is not the active one, so they stopped granting
  # anything the moment active_milestone became M3. They are kept as the
  # historical record of what M2 was allowed to touch.

  - id: m3-milestone-gate
    milestone: M3
    paths:
      - .github/workflows/ci.yml
      - scripts/ci_local.sh
    reason: >
      The milestone audit is hardcoded to M2 in both the GitHub workflow and
      the local CI mirror. M3 slice 1 must retarget both to M3 together —
      tests/unit/test_ci_parity.py fails if only one moves — and scripts/** is
      outside M3's declared scope in configs/milestone_scope.yaml.
    granted_on: 2026-08-12
    granted_by_pr: 7

  - id: m3-architecture-transition
    milestone: M3
    paths:
      - configs/architecture_rules.yaml
    reason: >
      configs/architecture_rules.yaml becomes a governance path in this same
      change, so M3 needs an explicit grant to perform the layer transition its
      requirements depend on. This approval authorises exactly four changes to
      that file and nothing else:
        1. add layer cpp-participant-app (paths cpp/participant/app, namespace
           aegis::participant::app, expect_sources_from_milestone M3) as the
           participant composition root, mirroring cpp-exchange-app;
        2. add the edge cpp-bindings -> cpp-statistics, required by AEGIS-107's
           cross-language comparison and by nothing else;
        3. add the edge cpp-exchange-app -> cpp-exchange-market-data, required
           to wire the market-data publisher into the exchange composition
           root;
        4. set cpp-statistics.may_depend_on to [cpp-common] — removing the
           cpp-participant-book-builder dependency so the generic statistics
           library carries no participant-domain dependency — together with the
           adjacent forward-only pipeline comment that describes that
           relationship.
      Explicitly NOT authorised by this approval: any other may_depend_on
      widening; re-dating any layer's expect_sources_from_milestone; relaxing
      any entry under `banned` (parent_relative_includes,
      python_headers_only_in, gateway_header_markers,
      mutable_globals_forbidden_in); narrowing covered_roots; or any other
      weakening of architecture policy. The approval is exact-path and
      milestone-scoped, so it expires when M3 does.
    granted_on: 2026-08-12
    granted_by_pr: 7

  # The two M3 approvals above are inert from here on, for the same reason the
  # M2 pair became inert at the M3 transition: approved_paths() skips any entry
  # whose milestone is not the active one. They are kept as the historical
  # record of what M3 was allowed to touch.

  - id: m4-architecture-transition
    milestone: M4
    paths:
      - configs/architecture_rules.yaml
    reason: >
      cpp/participant/strategy is dated M4 in configs/architecture_rules.yaml
      and must become non-empty this milestone, but nothing may legally compose
      it: cpp-participant-app — the participant composition root, and the only
      layer permitted to see feed handler, book builder, statistics, OMS and
      portfolio at once (ADR-0020) — has no edge to it. This approval
      authorises exactly one change to that file and nothing else:
        1. add cpp-participant-strategy to cpp-participant-app.may_depend_on.
      Explicitly NOT authorised by this approval: an edge from
      cpp-participant-strategy to cpp-participant-oms, to any cpp-exchange-*
      layer, or to any gateway/broker adapter — the pipeline stays forward-only
      and strategies emit proposals only; an edge from cpp-bindings to
      cpp-participant-strategy; any other may_depend_on widening; re-dating any
      layer's expect_sources_from_milestone; relaxing any entry under `banned`
      (parent_relative_includes, python_headers_only_in,
      gateway_header_markers, mutable_globals_forbidden_in); narrowing
      covered_roots; or any other weakening of architecture policy. The
      approval is exact-path and milestone-scoped, so it expires when M4 does.
    granted_on: 2026-08-17
    granted_by_pr: 10

  - id: m4-build-wiring
    milestone: M4
    paths:
      - cpp/participant/CMakeLists.txt
      - cpp/participant/app/CMakeLists.txt
    reason: >
      cpp/participant/strategy cannot build without a subdirectory entry in
      cpp/participant/CMakeLists.txt, and cpp/participant/app/CMakeLists.txt
      must add the corresponding link edge — tools/check_architecture.py reads
      target_link_libraries independently of includes, so the build graph and
      the layer DAG have to move together. Both files sit outside M4's declared
      scope in configs/milestone_scope.yaml, which allows only
      cpp/participant/strategy/** on the C++ side.
    granted_on: 2026-08-17
    granted_by_pr: 10

  - id: m4-milestone-gate
    milestone: M4
    paths:
      - .github/workflows/ci.yml
      - scripts/ci_local.sh
    reason: >
      The milestone audit is hardcoded to M3 in both the GitHub workflow and
      the local CI mirror. M4 batch 1 must retarget both to M4 together —
      tests/unit/test_ci_parity.py fails if only one moves — and scripts/** is
      outside M4's declared scope in configs/milestone_scope.yaml.
    granted_on: 2026-08-17
    granted_by_pr: 10
