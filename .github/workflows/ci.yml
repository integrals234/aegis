name: AEGIS CI

# AEGIS-234: CI runs spec audit, build, tests, static checks and secret scanning.
#
# The stages here are the same ones scripts/ci_local.sh runs, in the same order.
# tests/unit/test_ci_parity.py asserts the two agree, because a workflow that has
# quietly diverged from the local gate matrix is worse than no workflow: it makes
# a green tick mean something different from what a developer just ran.
#
# AEGIS-234's acceptance criterion is "main branch requires passing workflow".
# That needs a remote and a branch-protection rule, which are owner actions. The
# requirement carries a registered verification obligation until a real run
# exists — see docs/DEFERRED_VERIFICATION.md.

# Triggers are deliberately narrow. Running on both `push: ["**"]` and
# `pull_request` meant every commit on a branch with an open PR ran the whole
# matrix twice, for the same tree, burning runner time and doubling the
# notifications without checking anything the other run did not.
#
# A feature branch is now covered by its pull request; `main` is covered by
# the push that lands on it. `workflow_dispatch` stays so a branch without a
# PR can still be checked on demand.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AEGIS_VENV: ${{ github.workspace }}/.venv

jobs:
  governance:
    name: Governance and specification integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The frozen-file and scope gates diff against the merge base, so the
          # full history is required. A shallow clone makes them pass vacuously.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned environment
        run: |
          python3 -m venv "$AEGIS_VENV"
          "$AEGIS_VENV/bin/pip" install --upgrade pip
          "$AEGIS_VENV/bin/pip" install --require-hashes -r requirements/requirements.lock

      - name: Requirement catalogue and evidence
        run: |
          $AEGIS_VENV/bin/python tools/audit_requirements.py

      - name: Active milestone
        run: |
          $AEGIS_VENV/bin/python tools/audit_requirements.py --milestone M5

      # Both of these are ADVISORY since R8 (ADR-0014). They run from the pull
      # request's own checkout, so the pull request can change what they say.
      # The trust boundary is the separate "Authoritative governance gate (R8)"
      # workflow, which runs main's checker under pull_request_target. These are
      # kept because they are fast, and because a regression in them is worth
      # seeing even though it is not what decides the merge.
      - name: Frozen specification files (advisory)
        run: |
          $AEGIS_VENV/bin/python tools/check_frozen.py --base origin/main

      - name: Milestone scope (advisory)
        run: |
          $AEGIS_VENV/bin/python tools/check_scope.py --base origin/main

      - name: Architecture dependency rules
        run: |
          $AEGIS_VENV/bin/python tools/check_architecture.py

      - name: Claims audit
        run: |
          $AEGIS_VENV/bin/python tools/check_claims.py

      - name: Decision records
        run: |
          $AEGIS_VENV/bin/python tools/check_adrs.py --base origin/main

      - name: Documentation audit
        run: |
          $AEGIS_VENV/bin/python tools/check_docs.py

      - name: Sample-data policy
        run: |
          $AEGIS_VENV/bin/python tools/check_sample_data.py

      - name: Pack manifest
        run: |
          $AEGIS_VENV/bin/python tools/check_pack_manifest.py

      - name: Traceability matrix is current
        run: |
          "$AEGIS_VENV/bin/python" tools/generate_traceability.py
          git diff --exit-code docs/TRACEABILITY_MATRIX.md

      - name: Deferred-verification register is current
        run: |
          "$AEGIS_VENV/bin/python" tools/generate_deferred_register.py
          git diff --exit-code docs/DEFERRED_VERIFICATION.md

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # History matters here more than anywhere: a key deleted in a later
          # commit is still in the repository.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan worktree, index and history
        run: python3 tools/scan_secrets.py --staged --history

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the declared floor; 3.14 is what the development host runs.
        # Testing both is what makes "supported range" a checked claim rather
        # than an intention. tools/probe_dependencies.py proves every pinned
        # dependency has a wheel for each.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the pinned environment
        run: |
          python3 -m venv "$AEGIS_VENV"
          "$AEGIS_VENV/bin/pip" install --upgrade pip
          "$AEGIS_VENV/bin/pip" install --require-hashes -r requirements/requirements.lock

      - name: Lint
        run: |
          $AEGIS_VENV/bin/ruff check .

      - name: Type check
        run: |
          $AEGIS_VENV/bin/mypy

      # -DPython3_EXECUTABLE pins CMake to the venv this job actually installed
      # pybind11 into, instead of leaving FindPython3 to pick from PATH; and
      # -DAEGIS_REQUIRE_BINDINGS=ON makes a failure to configure the module an
      # error here rather than a silently missing target that surfaces later as
      # an unexplained import failure in the integration layer.
      - name: Build the C++ extension the integration layer needs
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build python3-dev python3-venv
          export PATH="$AEGIS_VENV/bin:$PATH"
          cmake --preset debug \
            -DPython3_EXECUTABLE="$AEGIS_VENV/bin/python" \
            -DAEGIS_REQUIRE_BINDINGS=ON
          cmake --build --preset debug

      # Each layer runs and is reported separately, and a layer that collects
      # zero tests fails: a green empty layer is a stub presented as completion.
      - name: Test layers
        run: |
          export PATH="$AEGIS_VENV/bin:$PATH"
          "$AEGIS_VENV/bin/python" tools/run_test_layers.py \
            --python "$AEGIS_VENV/bin/python" \
            --report "$RUNNER_TEMP/test-layers.json"

      - name: Upload the layer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-layers-${{ matrix.python-version }}
          path: ${{ runner.temp }}/test-layers.json
          if-no-files-found: warn

  cpp:
    name: C++ ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan-ubsan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build python3-dev python3-venv
          python3 -m venv "$AEGIS_VENV"
          "$AEGIS_VENV/bin/pip" install --upgrade pip
          "$AEGIS_VENV/bin/pip" install --require-hashes -r requirements/requirements.lock

      # See the python job for why Python3_EXECUTABLE and AEGIS_REQUIRE_BINDINGS
      # are pinned: the debug preset's compile_commands.json is what the style
      # step below feeds to clang-tidy, and a missing bindings target there
      # produces diagnostics about a broken parse rather than about the code.
      - name: Configure, build and test
        run: |
          export PATH="$AEGIS_VENV/bin:$PATH"
          cmake --preset ${{ matrix.preset }} \
            -DPython3_EXECUTABLE="$AEGIS_VENV/bin/python" \
            -DAEGIS_REQUIRE_BINDINGS=ON
          cmake --build --preset ${{ matrix.preset }}
          ctest --preset ${{ matrix.preset }}

      # clang-format and clang-tidy come from the lockfile, so the version that
      # gates CI is the version a developer runs locally.
      - name: Format and static analysis
        if: matrix.preset == 'debug'
        run: |
          export PATH="$AEGIS_VENV/bin:$PATH"
          bash scripts/check_cpp_style.sh build/debug

  determinism:
    name: Determinism harness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned environment
        run: |
          python3 -m venv "$AEGIS_VENV"
          "$AEGIS_VENV/bin/pip" install --upgrade pip
          "$AEGIS_VENV/bin/pip" install --require-hashes -r requirements/requirements.lock

      - name: Canonical output is stable across processes
        run: |
          $AEGIS_VENV/bin/python tools/determinism_check.py --runs 3 --seed 42

      # Without this, the harness could be broken and every run would still pass.
      - name: The harness still detects nondeterminism
        run: |
          "$AEGIS_VENV/bin/python" tools/determinism_check.py \
            --producer nondeterministic --expect-failure

  # AEGIS-009: "Clean environment instructions build and run integrity tests
  # without undocumented steps."
  #
  # This job is the acceptance criterion executed rather than asserted. It runs
  # the canonical procedure from docs/ENVIRONMENT.md *verbatim* on a clean
  # GitHub-hosted runner and nothing else — deliberately no actions/setup-python,
  # because the document tells a reader to use the machine's own python3, and
  # setup-python would both deviate from that and export Python3_ROOT_DIR.
  # If a command here has to differ from the document, the document is wrong
  # and that is the bug this job exists to surface.
  #
  # The transcript and the captured environment record are uploaded as the
  # clean-machine evidence AEGIS-009 owes.
  reproducibility:
    name: Clean-machine reproducibility (AEGIS-009)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The document says `git clone <repository>` — an ordinary clone with
          # its history. actions/checkout defaults to --depth=1, which is not
          # that: it fetches only the ref under test, so origin/main does not
          # exist and tools/check_scope.py cannot compute a merge base. Cloning
          # in full is what the canonical procedure actually describes.
          fetch-depth: 0

      # docs/ENVIRONMENT.md "Setting up", step 0.
      - name: Step 0 — system toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build python3-dev python3-venv

      # Step 1. Note this is the machine's own python3, not a tool-cache one.
      - name: Step 1 — pinned Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --require-hashes -r requirements/requirements.lock

      - name: Step 2 — git hooks
        run: bash scripts/install_git_hooks.sh

      # Step 3. The executable form of docs/ENVIRONMENT.md: if step 0 or 1 is
      # incomplete, this fails here instead of somewhere further downstream.
      - name: Step 3 — verify the environment
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          bash scripts/check_environment.sh

      # docs/ENVIRONMENT.md "Building and testing", with the documented options.
      - name: Build and run the integrity tests
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          AEGIS_CMAKE_OPTS=(-DPython3_EXECUTABLE="$PWD/.venv/bin/python" -DAEGIS_REQUIRE_BINDINGS=ON)
          cmake --preset debug "${AEGIS_CMAKE_OPTS[@]}"
          cmake --build --preset debug
          ctest --preset debug
          cmake --preset release "${AEGIS_CMAKE_OPTS[@]}"
          cmake --build --preset release
          ctest --preset release
          python3 tools/run_test_layers.py --python .venv/bin/python

      # docs/ENVIRONMENT.md "Environment capture". This is the clean-machine
      # record: capture_environment.py's `ci` block ties it to this run.
      - name: Capture the clean-machine environment record
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          python3 tools/capture_environment.py --preset debug \
            --output "$RUNNER_TEMP/environment.json"
          cat "$RUNNER_TEMP/environment.json"

      - name: Upload the clean-machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-009-clean-machine
          path: ${{ runner.temp }}/environment.json
          if-no-files-found: error

  negative-gates:
    name: Gates fail on their counter-examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned environment
        run: |
          python3 -m venv "$AEGIS_VENV"
          "$AEGIS_VENV/bin/pip" install --upgrade pip
          "$AEGIS_VENV/bin/pip" install --require-hashes -r requirements/requirements.lock

      # A gate that cannot fail proves nothing. Each committed counter-example
      # must still be rejected; if one starts passing, this job fails.
      - name: Architecture checker rejects its violation fixture
        run: |
          if "$AEGIS_VENV/bin/python" tools/check_architecture.py \
               --root tests/unit/fixtures/arch_violation \
               --rules tests/unit/fixtures/arch_violation/configs/architecture_rules.yaml; then
            echo "::error::the architecture checker accepted its counter-example"; exit 1
          fi

      - name: Claims checker rejects its bad fixture
        run: |
          if "$AEGIS_VENV/bin/python" tools/check_claims.py \
               --root tests/unit/fixtures/claims_bad \
               --policy tests/unit/fixtures/claims_bad/claims_policy.yaml; then
            echo "::error::the claims checker accepted its counter-example"; exit 1
          fi

      - name: Secret scanner rejects its bad fixture
        run: |
          if python3 tools/scan_secrets.py --path tests/unit/fixtures/secrets_bad; then
            echo "::error::the secret scanner accepted its counter-example"; exit 1
          fi

      # The governance gate's counter-example is a candidate tree that attempts
      # every self-authorisation route R8 was reported for. If it ever passes,
      # the trust boundary has regressed.
      - name: Authoritative governance gate rejects its tampered fixture
        run: |
          if "$AEGIS_VENV/bin/python" tools/governance/authoritative_check.py \
               --trusted-root tests/unit/fixtures/governance_tampered/trusted \
               --candidate-dir tests/unit/fixtures/governance_tampered/candidate \
               --changed-files-from tests/unit/fixtures/governance_tampered/changed_files.txt; then
            echo "::error::the authoritative governance gate accepted its counter-example"; exit 1
          fi
