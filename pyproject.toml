[project]
name = "aegis"
version = "0.0.0"
description = "AEGIS futures research, exchange-simulation, risk and decision-intelligence platform"
requires-python = ">=3.12"

# AEGIS is run from the repository, not installed as a distribution: research
# runs, replays and experiments must execute the code at a known commit rather
# than whatever version happens to be on the machine (AEGIS-097, AEGIS-210).
# `python/` and `tools/` go on sys.path instead.

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["python", "tools"]
addopts = "--strict-markers --strict-config -ra"
# AEGIS-233. Every test belongs to exactly one layer, and each layer is reported
# separately. tools/run_test_layers.py fails a layer that collects zero tests:
# a green empty layer is a stub presented as completion.
markers = [
    "unit: single module or tool in isolation",
    "integration: two or more components wired together, including C++/Python boundaries",
    "property: invariants checked over generated inputs (hypothesis)",
    "replay: deterministic replay and byte-identical canonical output",
    "research: reproducibility of research artifacts and experiment manifests",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests/unit/fixtures", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tools import each other through a sys.path shim so that writing a status claim
# and auditing one share the same predicates; the import cannot precede the shim.
"tools/*.py" = ["E402"]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
files = ["python", "tools"]
mypy_path = "python:tools"
strict = true
warn_unreachable = true
exclude = ["^build/", "^tests/unit/fixtures/"]

[[tool.mypy.overrides]]
module = ["aegis_bindings", "aegis_bindings.*"]
ignore_missing_imports = true
