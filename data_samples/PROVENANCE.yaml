provenance_version: 1

# AEGIS-236 — every committed sample records where it came from, under what
# licence, and what it may be used for. tools/check_sample_data.py fails on a
# file with no entry here: a sample nobody can trace is a sample nobody can
# decide about later, including whether a result derived from it may be
# published.

samples:
  synthetic_book_events.csv:
    source: Generated by tools/make_sample_data.py in this repository; no market data involved.
    licence: Same as this repository. Contains no third-party data.
    redistributable: true
    description: >
      A synthetic stream of book-event-shaped rows used to exercise the schema
      registry and the CSV/JSON codecs. The prices and sizes are drawn from a
      seeded generator and describe no real instrument, venue or trading day.
      It is deliberately not market data: AEGIS-236 permits only redistributable
      samples, and a small slice of a licensed feed is still licensed.
    collected_on: 2026-08-06
